    M40.8 68 A3.2 5.5 0 1 0 47.2 68 A3.2 5.5 0 1 0 40.8 68 Z
    M52.8 68 A3.2 5.5 0 1 0 59.2 68 A3.2 5.5 0 1 0 52.8 68 Z"/>
</svg>
