<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Piggery Evaluator: FCL pig farm visits">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Piggery Eval">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Piggery Evaluator</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }

    /* Boot loader: shown while Flutter downloads and starts.
       Same layout as the mobile splash, so web and phone open the same way. */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #FFFFFF;
      font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }

    /* Border + faint shadow: same as AppLogo, so the white tile never vanishes on the white page. */
    #boot .logo {
      width: 108px; height: 108px; border-radius: 24px; overflow: hidden;
      border: 1px solid #E4E0DB;
      box-shadow: 0 1px 2px rgba(30,30,30,.06), 0 1px 1px rgba(30,30,30,.04);
    }
    #boot .logo img { width: 100%; height: 100%; display: block; }
    #boot .name { margin-top: 20px; font-size: 20px; font-weight: 600; color: #1E1E1E; }
    #boot .tag  { margin-top: 6px; font-size: 13px; color: #6B6B6B; }

    #boot .bar {
      position: relative; overflow: hidden;
      width: 120px; height: 4px; margin-top: 36px;
      border-radius: 2px; background: #E4E0DB;
    }
    #boot .bar i {
      position: absolute; top: 0; bottom: 0; width: 40%;
      border-radius: 2px; background: #C8102E;
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide { from { left: -40%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { #boot .bar i { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading Piggery Evaluator">
    <div class="logo"><img src="logo.svg" alt=""></div>
    <div class="name">Piggery Evaluator</div>
    <div class="tag">Farmer's Choice · Pig department</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // Flutter fires this once it has painted its first frame.
    // Fade the loader out, then remove it so it can never sit over the app.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      setTimeout(function () { boot.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
